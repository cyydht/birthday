<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>24岁生日快乐 🎂</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{min-height:100%;}
  body{
    background: radial-gradient(ellipse at 50% 0%, #2a1a3e 0%, #150f24 45%, #0a0714 100%);
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    color:#fff;
    overflow-x:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:6vh 20px 12vh;
    position:relative;
  }
  #bg{position:fixed;inset:0;z-index:0;pointer-events:none;}
  .stage{
    position:relative;z-index:2;width:100%;max-width:640px;
    display:flex;flex-direction:column;align-items:center;
  }

  /* ===== 静止蛋糕 ===== */
  .cake-wrap{
    width:min(66vw,270px);
    opacity:0;
    transform:translateY(140px) scale(.85);
    animation:rise 1.3s cubic-bezier(.18,.89,.32,1.15) .3s forwards;
    filter:drop-shadow(0 18px 42px rgba(255,111,145,.38));
  }
  @keyframes rise{to{opacity:1;transform:translateY(0) scale(1);}}
  .cake{display:block;width:100%;height:auto;animation:floaty 3.4s ease-in-out 1.8s infinite;}
  @keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

  .flame-group{opacity:0;animation:lightUp .55s ease forwards;}
  @keyframes lightUp{to{opacity:1;}}
  .flame{
    transform-box:fill-box;
    transform-origin:50% 100%;
    animation:flick .36s ease-in-out infinite alternate;
  }
  @keyframes flick{
    from{transform:scale(1,1);}
    to{transform:scale(.88,1.16);}
  }

  /* ===== 标题 ===== */
  .title{
    margin-top:26px;
    font-size:clamp(26px,7.4vw,40px);
    font-weight:800;
    letter-spacing:3px;
    text-align:center;
    line-height:1.35;
    background:linear-gradient(100deg,#ffd8a8,#ff8fab,#c084fc,#7dd3fc,#ffd8a8);
    background-size:300% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    opacity:0;
    transform:scale(.5);
    animation:pop .9s cubic-bezier(.2,1.7,.4,1) 2s forwards,
              shine 5s linear 2.9s infinite;
  }
  @keyframes pop{to{opacity:1;transform:scale(1);}}
  @keyframes shine{to{background-position:300% 0;}}

  .sub{
    margin-top:12px;
    font-size:clamp(10px,3vw,12px);
    letter-spacing:7px;
    color:rgba(255,255,255,.45);
    opacity:0;
    animation:fadeIn 1s ease 2.45s forwards;
  }
  @keyframes fadeIn{to{opacity:1;}}

  /* ===== 祝福语（1.4秒间隔） ===== */
  .msgs{
    margin-top:30px;width:100%;
    display:flex;flex-direction:column;gap:13px;
  }
  .msg{
    padding:15px 20px;
    border-radius:18px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    box-shadow:0 8px 30px rgba(0,0,0,.28);
    font-size:clamp(14px,4.2vw,16.5px);
    line-height:1.75;
    letter-spacing:.6px;
    text-align:center;
    opacity:0;
    transform:translateY(18px);
    animation:fadeUp .9s cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes fadeUp{to{opacity:1;transform:translateY(0);}}
  .msg:nth-child(1){animation-delay:2.9s;}
  .msg:nth-child(2){animation-delay:4.3s;}
  .msg:nth-child(3){animation-delay:5.7s;}
  .msg:nth-child(4){animation-delay:7.1s;}
  .msg:nth-child(5){animation-delay:8.5s;}
  .msg:nth-child(6){animation-delay:9.9s;}

  .sign{
    margin-top:28px;
    font-size:clamp(13px,3.8vw,15px);
    letter-spacing:2px;
    color:rgba(255,190,210,.9);
    opacity:0;
    animation:fadeIn 1.2s ease 11.3s forwards;
  }
  .sign .name{color:#ffd8a8;font-weight:700;}
  .sign .heart{
    display:inline-block;color:#ff8fab;
    animation:beat 1.2s ease-in-out infinite;
  }
  @keyframes beat{0%,100%{transform:scale(1);}30%{transform:scale(1.28);}60%{transform:scale(1);}}

  @media (max-width:360px){
    .msg{padding:13px 16px;}
    .msgs{gap:11px;}
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<main class="stage">

  <!-- ===== 静止生日蛋糕 ===== -->
  <div class="cake-wrap">
    <svg class="cake" viewBox="0 0 260 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="l1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ff8fab"/><stop offset="1" stop-color="#d63e6e"/>
        </linearGradient>
        <linearGradient id="l2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffb3c6"/><stop offset="1" stop-color="#ff6f91"/>
        </linearGradient>
        <linearGradient id="l3" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffe3ec"/><stop offset="1" stop-color="#ffb3c6"/>
        </linearGradient>
        <linearGradient id="candleG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fffbe8"/><stop offset="1" stop-color="#ffd166"/>
        </linearGradient>
        <linearGradient id="flameG2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fffbd6"/>
          <stop offset="55%" stop-color="#ffd93d"/>
          <stop offset="100%" stop-color="#ff8a00"/>
        </linearGradient>
        <radialGradient id="glowG">
          <stop offset="0" stop-color="#ffd93d" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#ffd93d" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- 盘子 -->
      <ellipse cx="130" cy="272" rx="114" ry="15" fill="#ffffff" opacity=".08"/>
      <ellipse cx="130" cy="267" rx="98" ry="11" fill="#ffffff" opacity=".06"/>

      <!-- 底层 -->
      <rect x="38" y="198" width="184" height="68" rx="14" fill="url(#l1)"/>
      <path d="M38,198 q11.5,24 23,0 q11.5,24 23,0 q11.5,24 23,0 q11.5,24 23,0
               q11.5,24 23,0 q11.5,24 23,0 q11.5,24 23,0 q11.5,24 23,0 Z"
            fill="#fff6f9" opacity=".95"/>

      <!-- 中层 -->
      <rect x="62" y="148" width="136" height="56" rx="12" fill="url(#l2)"/>
      <path d="M62,148 q17,22 34,0 q17,22 34,0 q17,22 34,0 q17,22 34,0 Z"
            fill="#fff6f9" opacity=".95"/>

      <!-- 顶层 -->
      <rect x="86" y="106" width="88" height="48" rx="10" fill="url(#l3)"/>
      <path d="M86,106 q11,20 22,0 q11,20 22,0 q11,20 22,0 q11,20 22,0 Z"
            fill="#fffafc"/>

      <!-- 装饰糖珠 -->
      <circle cx="58" cy="238" r="3" fill="#ffe066" opacity=".9"/>
      <circle cx="96" cy="252" r="2.6" fill="#7dd3fc" opacity=".9"/>
      <circle cx="150" cy="244" r="3" fill="#c084fc" opacity=".9"/>
      <circle cx="196" cy="236" r="2.6" fill="#ffe066" opacity=".9"/>
      <circle cx="80" cy="176" r="2.6" fill="#ffe066" opacity=".9"/>
      <circle cx="118" cy="188" r="2.2" fill="#7dd3fc" opacity=".9"/>
      <circle cx="168" cy="180" r="2.6" fill="#c084fc" opacity=".9"/>
      <circle cx="102" cy="136" r="2.2" fill="#ffe066" opacity=".9"/>
      <circle cx="152" cy="142" r="2.2" fill="#7dd3fc" opacity=".9"/>

      <!-- 蜡烛 1 -->
      <g transform="translate(100,72)">
        <rect x="0" y="0" width="8" height="36" rx="3" fill="url(#candleG)"/>
        <rect x="0" y="6"  width="8" height="3" rx="1.5" fill="#ff6f91" opacity=".55"/>
        <rect x="0" y="16" width="8" height="3" rx="1.5" fill="#ff6f91" opacity=".55"/>
        <rect x="0" y="26" width="8" height="3" rx="1.5" fill="#ff6f91" opacity=".55"/>
        <g class="flame-group" style="animation-delay:1.50s">
          <circle cx="4" cy="-9" r="15" fill="url(#glowG)"/>
          <path class="flame" style="animation-duration:.34s"
                d="M4,0 C-0.5,-5 -1.5,-11 4,-17 C9.5,-11 8.5,-5 4,0 Z" fill="url(#flameG2)"/>
        </g>
      </g>

      <!-- 蜡烛 2 -->
      <g transform="translate(126,72)">
        <rect x="0" y="0" width="8" height="36" rx="3" fill="url(#candleG)"/>
        <rect x="0" y="6"  width="8" height="3" rx="1.5" fill="#c084fc" opacity=".55"/>
        <rect x="0" y="16" width="8" height="3" rx="1.5" fill="#c084fc" opacity=".55"/>
        <rect x="0" y="26" width="8" height="3" rx="1.5" fill="#c084fc" opacity=".55"/>
        <g class="flame-group" style="animation-delay:1.62s">
          <circle cx="4" cy="-9" r="15" fill="url(#glowG)"/>
          <path class="flame" style="animation-duration:.40s"
                d="M4,0 C-0.5,-5 -1.5,-11 4,-17 C9.5,-11 8.5,-5 4,0 Z" fill="url(#flameG2)"/>
        </g>
      </g>

      <!-- 蜡烛 3 -->
      <g transform="translate(152,72)">
        <rect x="0" y="0" width="8" height="36" rx="3" fill="url(#candleG)"/>
        <rect x="0" y="6"  width="8" height="3" rx="1.5" fill="#7dd3fc" opacity=".55"/>
        <rect x="0" y="16" width="8" height="3" rx="1.5" fill="#7dd3fc" opacity=".55"/>
        <rect x="0" y="26" width="8" height="3" rx="1.5" fill="#7dd3fc" opacity=".55"/>
        <g class="flame-group" style="animation-delay:1.74s">
          <circle cx="4" cy="-9" r="15" fill="url(#glowG)"/>
          <path class="flame" style="animation-duration:.30s"
                d="M4,0 C-0.5,-5 -1.5,-11 4,-17 C9.5,-11 8.5,-5 4,0 Z" fill="url(#flameG2)"/>
        </g>
      </g>
    </svg>
  </div>

  <!-- ===== 标题 ===== -->
  <h1 class="title">24岁生日快乐</h1>
  <p class="sub">HAPPY 24TH BIRTHDAY</p>

  <!-- ===== 祝福语 ===== -->
  <div class="msgs">
    <div class="msg">🎂 亲爱的邓海涛，24岁生日快乐！</div>
    <div class="msg">💼 愿你事业顺心，工作顺利，日进斗金</div>
    <div class="msg">🍀 愿你身体健康，出行平安</div>
    <div class="msg">🌙 记得早些睡觉，你的身体最重要</div>
    <div class="msg">🍚 也要多多吃饭，好好补充营养</div>
    <div class="msg">❤️ 往后的每一年，我都想陪你一起过</div>
  </div>

  <p class="sign">—— 最爱你的 <span class="name">陈宇烨</span> <span class="heart">❤️</span></p>

</main>

<script>
(function () {
  var cvs = document.getElementById('bg');
  var ctx = cvs.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;
  var stars = [];
  var parts = [];
  var petals = [];

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    cvs.width = W * DPR;
    cvs.height = H * DPR;
    cvs.style.width = W + 'px';
    cvs.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    stars = [];
    var count = Math.min(240, Math.floor(W * H / 8500));
    for (var i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.5 + 0.3,
        a: Math.random() * 0.8 + 0.2,
        da: (Math.random() * 0.012 + 0.003) * (Math.random() < 0.5 ? -1 : 1),
        c: Math.random() < 0.35 ? '#ffd9a8'
           : (Math.random() < 0.5 ? '#cfd8ff' : '#ffffff')
      });
    }

    petals = [];
    var pCount = Math.floor(W / 14) + 16;
    for (var k = 0; k < pCount; k++) {
      petals.push(makePetal(true));
    }
  }

  function makePetal(init) {
    return {
      x: Math.random() * W,
      y: init ? Math.random() * H : -20 - Math.random() * 60,
      r: 5 + Math.random() * 7,
      speedY: 0.5 + Math.random() * 1.3,
      speedX: (Math.random() - 0.5) * 0.9,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.008 + Math.random() * 0.018,
      swayAmp: 0.5 + Math.random() * 1.4,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.03,
      alpha: 0.45 + Math.random() * 0.45,
      hue: 330 + Math.random() * 22
    };
  }

  window.addEventListener('resize', resize);
  resize();

  function firework(x, y, hue) {
    if (hue === undefined) hue = Math.random() * 360;
    var n = 100 + Math.floor(Math.random() * 90);
    var power = 1.6 + Math.random() * 1.8;
    for (var i = 0; i < n; i++) {
      var ang = Math.random() * Math.PI * 2;
      var sp = (Math.random() * 5 + 1.2) * power;
      parts.push({
        x: x, y: y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        life: 1,
        decay: 0.007 + Math.random() * 0.013,
        color: 'hsl(' + (hue + (Math.random() * 70 - 35)) + ',100%,' +
               (60 + Math.random() * 30) + '%)',
        r: Math.random() * 2.4 + 0.9
      });
    }
    if (parts.length > 6000) parts.splice(0, parts.length - 6000);
  }

  function loop() {
    ctx.clearRect(0, 0, W, H);

    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.a += s.da;
      if (s.a > 1) { s.a = 1; s.da *= -1; }
      if (s.a < 0.12) { s.a = 0.12; s.da *= -1; }
      ctx.globalAlpha = s.a;
      ctx.fillStyle = s.c;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.globalCompositeOperation = 'lighter';
    for (var j = parts.length - 1; j >= 0; j--) {
      var p = parts[j];
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.985;
      p.vy = p.vy * 0.985 + 0.045;
      p.life -= p.decay;
      if (p.life <= 0) { parts.splice(j, 1); continue; }
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life + 0.4, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    for (var k = 0; k < petals.length; k++) {
      var pt = petals[k];
      pt.sway += pt.swaySpeed;
      pt.x += pt.speedX + Math.sin(pt.sway) * pt.swayAmp * 0.6;
      pt.y += pt.speedY;
      pt.rot += pt.rotSpeed;
      if (pt.y > H + 30) {
        petals[k] = makePetal(false);
        continue;
      }
      if (pt.x < -40) pt.x = W + 30;
      if (pt.x > W + 40) pt.x = -30;

      ctx.save();
      ctx.translate(pt.x, pt.y);
      ctx.rotate(pt.rot);
      ctx.globalAlpha = pt.alpha;
      ctx.fillStyle = 'hsl(' + pt.hue + ',90%,82%)';
      ctx.beginPath();
      ctx.moveTo(0, -pt.r);
      ctx.bezierCurveTo(pt.r * 0.9, -pt.r * 0.4, pt.r * 0.7, pt.r * 0.7, 0, pt.r * 0.85);
      ctx.bezierCurveTo(-pt.r * 0.7, pt.r * 0.7, -pt.r * 0.9, -pt.r * 0.4, 0, -pt.r);
      ctx.fill();
      ctx.globalAlpha = pt.alpha * 0.5;
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      ctx.beginPath();
      ctx.ellipse(-pt.r * 0.18, -pt.r * 0.2, pt.r * 0.22, pt.r * 0.35, 0.3, 0, 6.2832);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    requestAnimationFrame(loop);
  }
  loop();

  function scheduleFirework() {
    var delay = 700 + Math.random() * 900;
    setTimeout(function () {
      firework(W * (0.06 + Math.random() * 0.88), H * (0.06 + Math.random() * 0.48));
      if (Math.random() < 0.35) {
        setTimeout(function () {
          firework(W * (0.1 + Math.random() * 0.8), H * (0.08 + Math.random() * 0.4));
        }, 160);
      }
      scheduleFirework();
    }, delay);
  }
  setTimeout(function () {
    firework(W * 0.5, H * 0.3);
    firework(W * 0.22, H * 0.2);
    firework(W * 0.78, H * 0.22);
    scheduleFirework();
  }, 1500);

  window.addEventListener('pointerdown', function (e) {
    firework(e.clientX, e.clientY);
  });
})();
</script>
</body>
</html>
